<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor SRT → Libras IA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            min-height: 100vh;
            padding: 40px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .card {
            background: #111827;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .upload-box {
            border: 2px dashed #334155;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            margin-bottom: 25px;
            background: #0b1220;
        }

        input[type="file"] {
            margin-top: 20px;
            color: white;
        }

        .buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        button {
            border: none;
            padding: 14px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.02);
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-success {
            background: #16a34a;
            color: white;
        }

        .btn-libras {
            background: #7c3aed;
            color: white;
        }

        .status-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0b1220;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .status {
            color: #cbd5e1;
            font-size: 15px;
        }

        .recording-badge {
            display: none;
            background: #dc2626;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            animation: pulse-recording 1s infinite;
        }

        .workspace-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        @media (min-width: 768px) {
            .workspace-grid {
                grid-template-columns: 1.5fr 1fr;
            }
        }

        /* Coluna da legenda */
        .preview {
            background: #0b1220;
            border-radius: 16px;
            padding: 20px;
            height: 620px;
            display: flex;
            flex-direction: column;
        }

        .preview h3 {
            margin-bottom: 15px;
            flex-shrink: 0;
        }

        #previewList {
            overflow-y: auto;
            flex-grow: 1;
            padding-right: 10px;
        }

        #previewList::-webkit-scrollbar {
            width: 6px;
        }

        #previewList::-webkit-scrollbar-track {
            background: #1e293b;
            border-radius: 10px;
        }

        #previewList::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 10px;
        }

        .preview-item {
            padding: 12px;
            border-bottom: 1px solid #1e293b;
        }

        .preview-item:last-child {
            border-bottom: none;
        }

        .original {
            color: #94a3b8;
            margin-bottom: 5px;
        }

        .optimized {
            color: #22c55e;
            font-weight: bold;
        }

        /* ============================================================
           CONTAINER DO VLIBRAS — CORRIGIDO
           Cria um novo contexto de empilhamento sem clipar o conteúdo
           internos que usam position: fixed.
           ============================================================ */
        .vlibras-embed-container {
            background: #0b1220;
            border-radius: 16px;
            height: 520px;
            border: 2px solid #1e293b;
            position: relative;
            transition: border-color 0.3s;
            /* Cria novo stacking context para position: fixed interno */
            transform: translateZ(0);
            contain: layout style;
        }

        .vlibras-embed-container.is-recording {
            border-color: #dc2626 !important;
            box-shadow: 0 0 15px rgba(220, 38, 38, 0.3);
        }

        /* Deixa o div raiz do widget preencher todo o container */
        .vlibras-embed-container>div[vw] {
            position: absolute !important;
            inset: 0 !important;
            width: 100% !important;
            height: 100% !important;
            overflow: visible !important;
            top: auto !important;
        }   

        /* Wrapper interno também preenche tudo */
        [vw-plugin-wrapper] {
            position: absolute !important;
            inset: 0 !important;
            width: 100% !important;
            height: 100% !important;
            box-shadow: none !important;
            background: transparent !important;
            overflow: visible !important;
        }

        /* Wrapper superior do plugin */
        .vw-plugin-top-wrapper {
            position: absolute !important;
            inset: 0 !important;
            width: 100% !important;
            height: 100% !important;
            overflow: visible !important;
        }

        /* Esconde o botão flutuante padrão — usamos nosso próprio botão */
        [vw-access-button] {
            display: none !important;
        }

        #downloadBtn {
            display: none;
            text-decoration: none;
            background: #16a34a;
            color: white;
            padding: 14px 24px;
            border-radius: 12px;
            font-weight: bold;
        }

        .btn-success.recording {
            background: #dc2626 !important;
        }

        @keyframes pulse-recording {
            50% {
                opacity: 0.5;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card">

            <h1>🤟 Conversor SRT → Libras IA</h1>
            <p class="subtitle">Otimização automática de legendas para o VLibras usando IA.</p>

            <div class="upload-box">
                <h2>📄 Selecione o arquivo SRT</h2>
                <input type="file" id="fileInput" accept=".srt">
            </div>

            <div class="buttons">
                <button class="btn-primary" onclick="processarSRT()">⚡ Processar SRT</button>
                <button class="btn-libras" onclick="abrirVLibrasEGravar()">🤟 Abrir / Fechar VLibras</button>
                <button class="btn-success" id="btnGerar" onclick="gerarVideo()">🎬 Gerar Vídeo</button>
                <a id="downloadBtn">⬇ Baixar MP4</a>
            </div>

            <div class="status-container">
                <div class="status" id="status">Aguardando arquivo...</div>
                <div class="recording-badge" id="recordBadge">🔴 GRAVANDO AVATAR</div>
            </div>

            <div class="workspace-grid">

                <div class="preview">
                    <h3>🧠 Prévia da IA</h3>
                    <div id="previewList"></div>
                </div>

                <!-- Container do avatar -->
                <div class="vlibras-embed-container" id="avatarContainer">
                    <div vw class="enabled">
                        <div vw-access-button class="active"></div>
                        <div vw-plugin-wrapper>
                            <div class="vw-plugin-top-wrapper"></div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>

        new window.VLibras.Widget('https://vlibras.gov.br/app');

        const API_URL = 'http://localhost:5000';
        const avatarContainer = document.getElementById('avatarContainer');
        let glossas = [];
        let recorder;
        let chunks = [];
        let timeouts = [];
        let processandoSrt = false;

        function setStatus(t) { document.getElementById('status').innerText = t; }

        function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function srtToMs(time) {
            const [main, ms] = time.split(',');
            const [h, m, s] = main.split(':');
            return parseInt(h) * 3600000 + parseInt(m) * 60000 + parseInt(s) * 1000 + parseInt(ms);
        }

        function toggleAvatarLibras() {
            const btn = avatarContainer.querySelector('[vw-access-button]');
            if (btn) btn.click();
        }

        function esperarVLibras() {
            return new Promise(resolve => {
                const iv = setInterval(() => {
                    if (window.plugin?.player?.translate) { clearInterval(iv); resolve(); }
                }, 500);
            });
        }

        function findCanvasDeep(root) {
            const direct = root.querySelector('canvas');
            if (direct) return direct;
            for (const el of root.querySelectorAll('*')) {
                if (el.shadowRoot) {
                    const found = findCanvasDeep(el.shadowRoot);
                    if (found) return found;
                }
            }
            return null;
        }

        async function processarSRT() {
            try {
                const file = document.getElementById('fileInput').files[0];
                if (!file) { alert('Selecione um SRT'); return false; }
                setStatus('🧠 IA otimizando legendas...');
                const formData = new FormData();
                formData.append('file', file);
                const response = await fetch(`${API_URL}/otimizar-srt`, { method: 'POST', body: formData });
                const data = await response.json();
                if (!data.success) throw new Error(data.error);
                glossas = data.entries;
                renderPreview();
                setStatus(`✅ ${glossas.length} frases otimizadas`);
                return true;
            } catch (err) {
                console.error(err);
                setStatus('❌ Erro ao processar SRT');
                return false;
            }
        }

        async function abrirVLibrasEGravar() {
            if (glossas.length === 0) {
                alert('Processe o SRT primeiro.');
                return;
            }
            if (recorder?.state === 'recording') return;

            toggleAvatarLibras();
            await delay(1500);
            await gerarVideo(true);
        }

        document.getElementById('fileInput').addEventListener('change', async () => {
            const file = document.getElementById('fileInput').files[0];
            if (!file || processandoSrt) return;
            processandoSrt = true;
            try {
                await processarSRT();
            } finally {
                processandoSrt = false;
            }
        });

        function renderPreview() {
            const container = document.getElementById('previewList');
            container.innerHTML = '';
            glossas.forEach(item => {
                const div = document.createElement('div');
                div.className = 'preview-item';
                div.innerHTML = `<div class="original">${item.texto_original}</div>
                         <div class="optimized">🤟 ${item.texto_otimizado}</div>`;
                container.appendChild(div);
            });
        }

        async function gerarVideo(pularEsperaInicial = false) {
            if (glossas.length === 0) { alert('Processe o SRT primeiro.'); return; }
            if (recorder?.state === 'recording') return;

            if (!pularEsperaInicial) {
                setStatus('⏳ Aguardando VLibras carregar...');
                await esperarVLibras();
            }

            const canvas = findCanvasDeep(document);
            if (!canvas) {
                alert('Canvas 3D do VLibras não encontrado.\nAbra o avatar com o botão roxo e tente novamente.');
                setStatus('❌ Canvas não encontrado');
                return;
            }

            chunks = [];
            timeouts.forEach(clearTimeout);
            timeouts = [];

            let stream;
            try { stream = canvas.captureStream(30); }
            catch (e) { setStatus('❌ captureStream não suportado'); return; }

            const mimeType = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm']
                .find(m => MediaRecorder.isTypeSupported(m)) || 'video/webm';

            recorder = new MediaRecorder(stream, { mimeType });
            recorder.ondataavailable = e => { if (e.data?.size > 0) chunks.push(e.data); };
            recorder.onstop = enviarVideo;
            recorder.start(100);

            document.getElementById('btnGerar').classList.add('recording');
            document.getElementById('avatarContainer').classList.add('is-recording');
            document.getElementById('recordBadge').style.display = 'block';
            setStatus('🎥 Gravando avatar VLibras...');

            glossas.forEach(item => {
                const t = setTimeout(() => {
                    window.plugin?.player?.translate(item.texto_otimizado);
                }, srtToMs(item.start));
                timeouts.push(t);
            });

            const total = srtToMs(glossas[glossas.length - 1].end) + 3000;
            timeouts.push(setTimeout(pararGravacao, total));
        }

        function pararGravacao() {
            if (recorder?.state === 'recording') {
                recorder.stop();
                document.getElementById('btnGerar').classList.remove('recording');
                document.getElementById('avatarContainer').classList.remove('is-recording');
                document.getElementById('recordBadge').style.display = 'none';
            }
        }

        async function enviarVideo() {
            try {
                setStatus('⚡ Convertendo vídeo Full HD...');
                const blob = new Blob(chunks, { type: 'video/webm' });
                const formData = new FormData();
                formData.append('video', blob, 'libras.webm');
                const response = await fetch(`${API_URL}/salvar-video`, { method: 'POST', body: formData });
                const data = await response.json();
                if (!data.success) throw new Error(data.error);
                setStatus('✅ Vídeo salvo em /media');
                const downloadBtn = document.getElementById('downloadBtn');
                downloadBtn.href = `${API_URL}/media/${data.video_mp4.split('\\').pop()}`;
                downloadBtn.style.display = 'inline-block';
            } catch (err) {
                console.error(err);
                setStatus('❌ Erro ao salvar vídeo');
            }
        }
    </script>
</body>

</html>

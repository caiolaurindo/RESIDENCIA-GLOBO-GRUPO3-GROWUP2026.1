<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Conversor SRT → Libras IA</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            min-height: 100vh;
            padding: 40px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .card {
            background: #111827;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .upload-box {
            border: 2px dashed #334155;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            margin-bottom: 25px;
            background: #0b1220;
        }

        input[type="file"] {
            margin-top: 20px;
            color: white;
        }

        .buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        button {
            border: none;
            padding: 14px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.02);
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-success {
            background: #16a34a;
            color: white;
        }

        .btn-danger {
            background: #dc2626;
            color: white;
        }

        .status {
            background: #0b1220;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 25px;
            color: #cbd5e1;
            font-size: 15px;
        }

        .preview {
            background: #0b1220;
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
        }

        .preview h3 {
            margin-bottom: 15px;
        }

        .preview-item {
            padding: 12px;
            border-bottom: 1px solid #1e293b;
        }

        .preview-item:last-child {
            border-bottom: none;
        }

        .original {
            color: #94a3b8;
            margin-bottom: 5px;
        }

        .optimized {
            color: #22c55e;
            font-weight: bold;
        }

        #downloadBtn {
            display: none;
            text-decoration: none;
            background: #16a34a;
            color: white;
            padding: 14px 24px;
            border-radius: 12px;
            font-weight: bold;
        }

        .recording {
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            50% {
                opacity: 0.5;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>🤟 Conversor SRT → Libras IA</h1>

            <p class="subtitle">
                Otimização automática de legendas para o VLibras usando IA.
            </p>

            <div class="upload-box">

                <h2>📄 Selecione o arquivo SRT</h2>

                <input
                    type="file"
                    id="fileInput"
                    accept=".srt"
                >
            </div>

            <div class="buttons">

                <button
                    class="btn-primary"
                    onclick="processarSRT()"
                >
                    ⚡ Processar SRT
                </button>

                <button
                    class="btn-success"
                    id="btnGerar"
                    onclick="gerarVideo()"
                >
                    🎬 Gerar Vídeo
                </button>

                <a id="downloadBtn">
                    ⬇ Baixar MP4
                </a>
            </div>

            <div class="status" id="status">
                Aguardando arquivo...
            </div>

            <div class="preview">

                <h3>🧠 Prévia da IA</h3>

                <div id="previewList"></div>
            </div>
        </div>
    </div>

    <!-- VLIBRAS -->

    <div vw class="enabled">
        <div vw-access-button class="active"></div>

        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>

    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>

    <script>

        // =========================================
        // VLIBRAS
        // =========================================

        new window.VLibras.Widget(
            'https://vlibras.gov.br/app'
        );

        // =========================================
        // CONFIG
        // =========================================

        const API_URL = 'http://localhost:5000';

        let glossas = [];

        let recorder;

        let chunks = [];

        let timeouts = [];

        // =========================================
        // STATUS
        // =========================================

        function setStatus(texto) {

            document.getElementById(
                'status'
            ).innerText = texto;
        }

        // =========================================
        // TIMESTAMP
        // =========================================

        function srtToMs(time) {

            const [main, ms] = time.split(',');

            const [h, m, s] = main.split(':');

            return (
                parseInt(h) * 3600000 +
                parseInt(m) * 60000 +
                parseInt(s) * 1000 +
                parseInt(ms)
            );
        }

        // =========================================
        // PROCESSAR SRT
        // =========================================

        async function processarSRT() {

            try {

                const file = document.getElementById(
                    'fileInput'
                ).files[0];

                if (!file) {

                    alert('Selecione um SRT');
                    return;
                }

                setStatus(
                    '🧠 IA otimizando legendas...'
                );

                const formData = new FormData();

                formData.append(
                    'file',
                    file
                );

                const response = await fetch(
                    `${API_URL}/otimizar-srt`,
                    {
                        method: 'POST',
                        body: formData
                    }
                );

                const data = await response.json();

                if (!data.success) {

                    throw new Error(
                        data.error
                    );
                }

                glossas = data.entries;

                renderPreview();

                setStatus(
                    `✅ ${glossas.length} frases otimizadas`
                );

            } catch (err) {

                console.error(err);

                setStatus(
                    '❌ Erro ao processar SRT'
                );
            }
        }

        // =========================================
        // PREVIEW
        // =========================================

        function renderPreview() {

            const container = document.getElementById(
                'previewList'
            );

            container.innerHTML = '';

            glossas.forEach(item => {

                const div = document.createElement('div');

                div.className = 'preview-item';

                div.innerHTML = `
                    <div class="original">
                        ${item.texto_original}
                    </div>

                    <div class="optimized">
                        🤟 ${item.texto_otimizado}
                    </div>
                `;

                container.appendChild(div);
            });
        }

        // =========================================
        // ESPERAR VLIBRAS
        // =========================================

        function esperarVLibras() {

            return new Promise(resolve => {

                const interval = setInterval(() => {

                    if (
                        window.plugin &&
                        window.plugin.player &&
                        typeof window.plugin.player.translate === 'function'
                    ) {

                        clearInterval(interval);

                        resolve();
                    }

                }, 1000);
            });
        }

        // =========================================
        // GERAR VIDEO
        // =========================================

        async function gerarVideo() {

            if (glossas.length === 0) {

                alert(
                    'Processe o SRT primeiro.'
                );

                return;
            }

            await esperarVLibras();

            const canvas = document.querySelector(
                'canvas'
            );

            if (!canvas) {

                alert(
                    'Canvas do VLibras não encontrado.'
                );

                return;
            }

            chunks = [];

            timeouts.forEach(clearTimeout);

            timeouts = [];

            const stream = canvas.captureStream(30);

            recorder = new MediaRecorder(
                stream,
                {
                    mimeType: 'video/webm'
                }
            );

            recorder.ondataavailable = e => {

                if (e.data.size > 0) {

                    chunks.push(e.data);
                }
            };

            recorder.onstop = enviarVideo;

            recorder.start();

            document.getElementById(
                'btnGerar'
            ).classList.add('recording');

            setStatus(
                '🎥 Gravando avatar VLibras...'
            );

            // =====================================
            // PLAY SINCRONIZADO
            // =====================================

            glossas.forEach(item => {

                const delay = srtToMs(
                    item.start
                );

                const timeout = setTimeout(() => {

                    console.log(
                        item.texto_otimizado
                    );

                    window.plugin.player.translate(
                        item.texto_otimizado
                    );

                }, delay);

                timeouts.push(timeout);

            });

            const ultimo = glossas[
                glossas.length - 1
            ];

            const total = (
                srtToMs(ultimo.end) + 3000
            );

            setTimeout(() => {

                pararGravacao();

            }, total);
        }

        // =========================================
        // PARAR
        // =========================================

        function pararGravacao() {

            if (
                recorder &&
                recorder.state === 'recording'
            ) {

                recorder.stop();

                document.getElementById(
                    'btnGerar'
                ).classList.remove('recording');
            }
        }

        // =========================================
        // ENVIAR VIDEO
        // =========================================

        async function enviarVideo() {

            try {

                setStatus(
                    '⚡ Convertendo vídeo Full HD...'
                );

                const blob = new Blob(
                    chunks,
                    {
                        type: 'video/webm'
                    }
                );

                const formData = new FormData();

                formData.append(
                    'video',
                    blob,
                    'libras.webm'
                );

                const response = await fetch(
                    `${API_URL}/salvar-video`,
                    {
                        method: 'POST',
                        body: formData
                    }
                );

                const data = await response.json();

                if (!data.success) {

                    throw new Error(
                        data.error
                    );
                }

                setStatus(
                    '✅ Vídeo salvo em /media'
                );

                // =================================
                // DOWNLOAD
                // =================================

                const downloadBtn = document.getElementById(
                    'downloadBtn'
                );

                const nomeArquivo = data.video_mp4
                    .split('\\')
                    .pop();

                downloadBtn.href = `${API_URL}/media/${nomeArquivo}`;

                downloadBtn.style.display = 'inline-block';

            } catch (err) {

                console.error(err);

                setStatus(
                    '❌ Erro ao salvar vídeo'
                );
            }
        }

    </script>

</body>

</html>
